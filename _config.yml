title: kwkw2828.github.io
description: 自作ソフトウェアの紹介・配布ページです。
url: "https://kwkw2828.github.io"
baseurl: ""
lang: ja
timezone: Asia/Tokyo

markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  software:
    output: true
    permalink: /software/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: software
    values:
      layout: software

exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _trash
