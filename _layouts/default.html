<!doctype html>
<html lang="{{ site.lang | default: 'ja' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <div class="container">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav aria-label="メインメニュー">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>ホーム</a>
          <a href="{{ '/software/' | relative_url }}"{% if page.url contains '/software/' %} aria-current="page"{% endif %}>ソフトウェア</a>
        </nav>
      </div>
    </header>
    <main id="main" class="container" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="container">
        <small>&copy; {{ site.time | date: '%Y' }} kwt (kwkw2828)</small>
        <a href="https://github.com/kwkw2828">GitHub プロフィール</a>
      </div>
    </footer>
  </body>
</html>
